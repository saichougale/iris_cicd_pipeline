services:
  mlflow:
    build: .
    container_name: iris-mlflow-server
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  trainer:
    build: .
    container_name: iris-model-trainer
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy
    command: ["python", "iris_mlflow.py"]
    restart: "no"

volumes:
  mlflow_data:
